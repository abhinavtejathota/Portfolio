services:
  - type: web
    name: portfolio
    runtime: static
    repo: https://github.com/abhinavtejathota/Portfolio
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORTFOLIO_ENCODE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
